name: herfiyah
description: "حِرفيّة (Herfiyah) — Beauty services marketplace connecting customers with skilled artisans."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # --- State management ------------------------------------------------------
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Navigation ------------------------------------------------------------
  go_router: ^14.8.1

  # --- Backend ---------------------------------------------------------------
  supabase_flutter: ^2.8.3

  # --- Storage / Security ----------------------------------------------------
  flutter_secure_storage: ^9.2.4

  # --- UI Utilities ----------------------------------------------------------
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2

  # --- Utilities -------------------------------------------------------------
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  # Assets will be uncommented as they are added:
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/fonts/

  # Fonts will be registered here once custom Arabic / display fonts are chosen:
  # fonts:
  #   - family: NotoKufiArabic
  #     fonts:
  #       - asset: assets/fonts/NotoKufiArabic-Regular.ttf
  #       - asset: assets/fonts/NotoKufiArabic-Bold.ttf
  #         weight: 700